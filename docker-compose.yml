name: firstcomment-agent

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  working_dir: /workspace/backend
  environment: &backend-env
    DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app:app@postgres:5432/firstcomment}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
    APP_SECRET_KEY: ${APP_SECRET_KEY:-development-only-change-me}
    TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=}
    APP_ENV: ${APP_ENV:-development}
    FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_API_BASE: ${LLM_API_BASE:-https://api.openai.com/v1}
    LLM_MODEL_FAST: ${LLM_MODEL_FAST:-mock-fast-v1}
    LLM_MODEL_NORMAL: ${LLM_MODEL_NORMAL:-mock-normal-v1}
    LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-5}
    AUTO_PUBLISH_DEFAULT: ${AUTO_PUBLISH_DEFAULT:-false}
    COMMENT_MODE: ${COMMENT_MODE:-REVIEW}
    QUALITY_ALLOW_THRESHOLD: ${QUALITY_ALLOW_THRESHOLD:-0.80}
    QUALITY_REVIEW_THRESHOLD: ${QUALITY_REVIEW_THRESHOLD:-0.65}
    RISK_ALLOW_THRESHOLD: ${RISK_ALLOW_THRESHOLD:-0.30}
    RISK_BLOCK_THRESHOLD: ${RISK_BLOCK_THRESHOLD:-0.65}
    DUPLICATE_BLOCK_THRESHOLD: ${DUPLICATE_BLOCK_THRESHOLD:-0.90}
    DUPLICATE_REVIEW_THRESHOLD: ${DUPLICATE_REVIEW_THRESHOLD:-0.82}
    TOKEN_ENCRYPTION_KEY_VERSION: ${TOKEN_ENCRYPTION_KEY_VERSION:-1}
    ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-60}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - firstcomment

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-firstcomment}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - firstcomment

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - firstcomment

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - firstcomment

  backend-api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 15s

  worker-critical:
    <<: *backend
    environment:
      <<: *backend-env
      WORKER_HEARTBEAT_NAME: worker-critical
    command:
      - dramatiq
      - app.workers.monitor_actors
      - app.workers.pipeline_actors
      - app.workers.publish_actors
      - --queues
      - critical
      - --processes
      - "1"
      - --threads
      - "4"

  worker-default:
    <<: *backend
    environment:
      <<: *backend-env
      WORKER_HEARTBEAT_NAME: worker-default
    command:
      - dramatiq
      - app.workers.monitor_actors
      - app.workers.pipeline_actors
      - app.workers.publish_actors
      - --queues
      - high
      - normal
      - --processes
      - "2"
      - --threads
      - "4"

  worker-low:
    <<: *backend
    environment:
      <<: *backend-env
      WORKER_HEARTBEAT_NAME: worker-low
    command:
      - dramatiq
      - app.workers.pipeline_actors
      - app.workers.publish_actors
      - --queues
      - low
      - --processes
      - "1"
      - --threads
      - "2"

  scheduler:
    <<: *backend
    command: ["python", "-m", "app.workers.scheduler"]

  outbox-relay:
    <<: *backend
    command: ["python", "-m", "app.workers.outbox_relay"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - firstcomment

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./docs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - firstcomment

networks:
  firstcomment:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
