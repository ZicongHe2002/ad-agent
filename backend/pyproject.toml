[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firstcomment-agent"
version = "0.1.0"
description = "Context-grounded and policy-safe first-comment workflow"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "cryptography>=44,<47",
  "dramatiq[redis,watch]>=1.17,<3",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<8",
  "SQLAlchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<27",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "testcontainers[postgres,redis]>=4.9,<5",
  "types-redis>=4.6.0.20241004",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["*.md", "manifest.yaml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]

[tool.ruff]
# Keep lint output parseable on the repository's lightweight Python 3.10
# verification interpreter; production images and package metadata require 3.12+.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
# The source intentionally stays parseable on the Python 3.10 interpreter used by
# lightweight local tooling while production targets 3.12+.  PEP 695/StrEnum-only
# rewrites would make that compatibility impossible without changing behaviour.
ignore = ["B008", "E501", "RUF001", "S101", "UP042", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"app/tests/**/*.py" = ["S101", "S105", "S106"]
"app/platforms/mock/failure_injection.py" = ["S311"]
"app/schemas/__init__.py" = ["F401"]
"app/schemas/user.py" = ["S105"]
"migrations/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
strict = true
warn_unreachable = true
exclude = ["migrations", "app/tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
